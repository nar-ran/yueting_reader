name: yueting_reader
description: "Universal Chinese reader and shadowing tool for custom texts, lyrics, and dialogues. Built with Flutter."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations: 
    sdk: flutter
  flutter_svg: ^2.0.10+1
  intl: ^0.20.2

  rename_app: ^1.1.2
  cupertino_icons: ^1.0.8

  # Almacenamiento local (Textos y diccionario)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.3

  # Procesamiento de Chino (Hanzi -> Pinyin)
  lpinyin: ^2.0.3

  # Audio y Reproducción
  audioplayers: ^6.0.0
  flutter_tts: ^4.0.2

  # Conexión HTTP
  http: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/ 

  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  
flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/icons/app_icon.png"